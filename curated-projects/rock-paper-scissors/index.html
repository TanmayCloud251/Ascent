<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1 class="game-title">Rock Paper Scissors</h1>
      <div class="score-board">
        <div class="score-card">
          <span class="score-label">Player</span>
          <span id="player-score" class="score-value">0</span>
        </div>
        <span class="score-divider">:</span>
        <div class="score-card">
          <span class="score-label">Computer</span>
          <span id="computer-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <main class="game-arena">
      <div class="choices-container">
        <button class="choice-btn" data-choice="rock" title="Rock">✊</button>
        <button class="choice-btn" data-choice="paper" title="Paper">✋</button>
        <button class="choice-btn" data-choice="scissors" title="Scissors">✌️</button>
      </div>

      <div class="battle-display">
        <div class="hand-box">
          <span class="hand-label">You Picked</span>
          <span id="player-hand" class="hand-icon">❓</span>
        </div>
        <div class="status-box">
          <p id="round-result" class="round-result">Choose your move to start!</p>
        </div>
        <div class="hand-box">
          <span class="hand-label">Computer Picked</span>
          <span id="computer-hand" class="hand-icon">❓</span>
        </div>
      </div>
    </main>

    <footer class="game-footer">
      <button id="reset-btn" class="reset-button">Reset Score</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
