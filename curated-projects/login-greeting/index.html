<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px -5px rgba(34, 211, 238, 0.15);
      padding: 2.25rem;
      border-radius: 16px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.025em;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    input {
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #090d16;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }
    input::placeholder {
      color: #64748b;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
      color: #041014;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 14px 0 rgba(6, 182, 212, 0.35);
      transition: all 0.2s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #22d3ee 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px 0 rgba(6, 182, 212, 0.45);
    }
    button:active {
      transform: translateY(0);
    }
    #greeting {
      min-height: 1.5rem;
      margin: 0.25rem 0 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: #38bdf8;
      text-align: center;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome</h1>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your name">
    <button type="button" id="greet-btn">Log in</button>
    <p id="greeting"></p>
  </main>
  <script>
    const input = document.getElementById('username');
    const button = document.getElementById('greet-btn');
    const greeting = document.getElementById('greeting');

    button.addEventListener('click', () => {
      const name = input.value.trim();
      greeting.textContent = name ? `Hello, ${name}!` : 'Please enter your username.';
    });
  </script>
</body>
</html>
