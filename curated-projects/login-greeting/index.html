<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 0.75rem; }
    input { padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: inherit; }
    button { padding: 0.6rem; border: none; border-radius: 6px; background: #22d3ee; color: #0f172a; font-weight: 600; cursor: pointer; }
    #greeting { min-height: 1.5rem; margin: 0; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome</h1>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your name">
    <button type="button" id="greet-btn">Log in</button>
    <p id="greeting"></p>
  </main>
  <script>
    const input = document.getElementById('username');
    const button = document.getElementById('greet-btn');
    const greeting = document.getElementById('greeting');

    button.addEventListener('click', () => {
      const name = input.value.trim();
      greeting.textContent = name ? `Hello, ${name}!` : 'Please enter your username.';
    });
  </script>
</body>
</html>
